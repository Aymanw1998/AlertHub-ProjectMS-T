# ===============================
# Gateway Swagger UI
# ===============================

springdoc.swagger-ui.path=/mst-gateway-sw-ui
springdoc.api-docs.path=/mst-gateway-api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.document-title=Alert Hub - GatewayMS

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.deepLinking=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urlsPrimaryName=GatewayMS


