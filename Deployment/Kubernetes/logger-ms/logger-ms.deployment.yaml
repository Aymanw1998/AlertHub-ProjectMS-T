apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-ms
  namespace: alerthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-ms
  template:
    metadata:
      labels:
        app: logger-ms
    spec:
      initContainers:
      - name: wait-for-logger-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z logger-db 27017; do echo waiting for logger-db:27017; sleep
          2; done
      containers:
      - name: logger-ms
        image: 209138155/alerthub-logger-ms:v5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1016
        env:
        - name: MONGO_URI
          value: logger-db
