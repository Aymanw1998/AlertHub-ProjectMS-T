apiVersion: apps/v1
kind: Deployment
metadata:
  name: loader-ms
  namespace: alerthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loader-ms
  template:
    metadata:
      labels:
        app: loader-ms
    spec:
      initContainers:
      - name: wait-for-loader-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z loader-db 3306; do echo waiting for loader-db:3306; sleep 2;
          done
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z redis 6379; do echo waiting for redis:6379; sleep 2; done
      containers:
      - name: loader-ms
        image: 209138155/alerthub-loader-ms:v5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1010
        env:
        - name: LOADER_DB_URL
          value: jdbc:mysql://loader-db:3306/LoaderDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        - name: MYSQL_USERNAME
          valueFrom:
            secretKeyRef:
              name: alerthub-secrets
              key: MYSQL_USERNAME
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alerthub-secrets
              key: MYSQL_PASSWORD
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
