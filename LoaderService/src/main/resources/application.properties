spring.application.name=LoaderService

server.port=1000

# connection with MySQL DB
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/Loader?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

#for swagger
# - swagger-ui
springdoc.swagger-ui.path=/mst-loader-sw-ui
# -YAML
springdoc.api-docs.path=/mst-loader-api-docs
#-TryOut
springdoc.swagger-ui.tryInOutEnabled=false

#openapi-urls
openapi.dev-url=http://127.0.0.1:9090
openapi.prod-url=http://127.0.0.1:8080
