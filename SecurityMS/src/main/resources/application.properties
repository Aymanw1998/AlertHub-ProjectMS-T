spring.application.name=SecurityMS

server.port=1008

user.service.url=${USER_URL:http://localhost:1009}

jwt.secret=${JWT_SECRET:AlertHubSecuritySecretKey19981998}
jwt.expiration=${JWT_EXPIRATION:3600000}

springdoc.swagger-ui.path=/mst-security-sw-ui
springdoc.api-docs.path=/mst-security-api-docs
springdoc.swagger-ui.tryItOutEnabled=true

# Change title web
springdoc.swagger-ui.document-title=Alert Hub - SecurityMS

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.deepLinking=true