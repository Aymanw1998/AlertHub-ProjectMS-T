spring.application.name=GatewayMS

server.port=1007

jwt.secret=AlertHubSecuritySecretKey19981998

# ===============================
# Main MS Routes
# ===============================

spring.cloud.gateway.server.webflux.routes[0].id=security-ms
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:1008
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=name=SecurityCB,fallbackUri=forward:/fallback/security

