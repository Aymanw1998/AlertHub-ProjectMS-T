spring.application.name=ActionMS

server.port=4000
spring.kafka.bootstrap-servers=localhost:9092


# connection with MySQL DB
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ActionDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

#for swagger
# - swagger-ui
springdoc.swagger-ui.path=/mst-action-sw-ui
# -YAML
springdoc.api-docs.path=/mst-action-api-docs
#-TryOut
springdoc.swagger-ui.tryItOutEnabled=false

spring.jackson.mapper.accept-case-insensitive-enums=true

