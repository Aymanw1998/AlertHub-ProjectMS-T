spring.application.name=MetricService

server.port=3000

# connection with MySQL DB
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/MetricService?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

#for swagger
# - swagger-ui
springdoc.swagger-ui.path=/mst-metric-sw-ui
# -YAML
springdoc.api-docs.path=/mst-metric-api-docs
#-TryOut
springdoc.swagger-ui.tryItOutEnabled=false


