spring.application.name=LoaderMS

server.port=1010

# connection with MySQL DB
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/LoaderDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

#for swagger
# - swagger-ui
springdoc.swagger-ui.path=/mst-loader-sw-ui
# -YAML
springdoc.api-docs.path=/mst-loader-api-docs
#-TryOut
springdoc.swagger-ui.tryItOutEnabled=true
#Change title web
springdoc.swagger-ui.document-title=Alert Hub - LoaderMS

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.deepLinking=true

spring.jackson.mapper.accept-case-insensitive-enums=true

spring.data.redis.host=localhost
spring.data.redis.port=6379



